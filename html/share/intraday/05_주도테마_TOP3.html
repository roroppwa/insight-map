.top-table{width:100%;border-collapse:separate;border-spacing:0;white-space:nowrap}
.top-table th,.top-table td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:right}

.top-table .theme-title{font-size:14px;font-weight:850}.leader-stock strong,.leader-stock span{display:block}.leader-stock span{margin-top:2px;font-size:11px}
.map-wrap{padding:16px}.theme-map{position:relative;height:500px;background:#edf1f6;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(207,215,229,.55)}

.rank-stock{min-width:0}.rank-stock strong,.rank-stock span,.rank-metric strong,.rank-metric span{display:block}.rank-stock strong{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-stock span,.rank-metric span{margin-top:4px;color:var(--muted);font-size:10px}.rank-metric{text-align:right;flex:0 0 auto}.rank-metric strong{font-size:13px;font-weight:850}.empty-row{display:flex!important;justify-content:center!important;padding-left:13px!important;color:var(--muted)}.empty-row::before{display:none!important}
.index-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.index-card{position:relative;display:block;min-width:0;padding:22px;color:inherit;text-decoration:none;background:linear-gradient(150deg,#fff,var(--surface-soft));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:transform .17s ease,border-color .17s ease,box-shadow .17s ease}.index-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--phase)}.index-card:hover{transform:translateY(-3px);border-color:var(--phase);box-shadow:0 14px 34px rgba(33,43,72,.11)}.index-card h2{margin:0;font-size:20px;letter-spacing:-.45px}.index-card p{margin:8px 0 0;min-height:44px;color:var(--muted);font-size:13px;line-height:1.55}.index-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}.index-kpi{min-width:0;padding:11px;background:rgba(238,242,248,.8);border-radius:10px}.index-kpi span{display:block;color:var(--muted);font-size:10px}.index-kpi strong{display:block;margin-top:5px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

:root{
  color-scheme:light!important;
  --bg:#f4f6fa;--surface:#ffffff;--surface-soft:#f8f9fc;--surface-strong:#eef2f8;
  --line:#e2e7f0;--line-strong:#cfd7e5;--text:#111827;--text-soft:#374151;

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}

<body class="phase-intraday">
